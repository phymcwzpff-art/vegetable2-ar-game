<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>채소 키우기 AR 게임 3.0</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Malgun Gothic',sans-serif;
}

body{
overflow:hidden;
background:#000;
}

#video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
z-index:1;
}

#handCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:3;
pointer-events:none;
}

#vegetable{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:180px;
transition:0.4s;
text-shadow:0 0 40px rgba(0,0,0,.5);
}

#status{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.7);
color:white;
padding:15px 30px;
border-radius:20px;
font-size:28px;
font-weight:bold;
z-index:10;
}

#warning{
position:fixed;
top:90px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:15px 30px;
border-radius:20px;
font-size:30px;
font-weight:bold;
display:none;
animation:blink .5s infinite;
}

@keyframes blink{
50%{
opacity:.2;
}
}

#boom{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:320px;
display:none;
animation:explode .8s ease-out;
}

@keyframes explode{

0%{
transform:translate(-50%,-50%) scale(.2);
opacity:1;
}

100%{
transform:translate(-50%,-50%) scale(2);
opacity:0;
}

}

#panel{

position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
z-index:100;
pointer-events:auto;

}

button{

padding:14px 20px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:15px;
cursor:pointer;

}

.vegBtn{

font-size:34px;

}

@media(max-width:900px){

#vegetable{
font-size:120px;
}

button{
font-size:18px;
}

}

</style>

</head>

<body>

<video id="video" autoplay playsinline muted></video>

<canvas id="handCanvas"></canvas>

<div id="overlay">

<div id="status">
✋ 손을 보여주세요
</div>

<div id="warning">
⚠️ 위험해요!
</div>

<div id="vegetable">
🍅
</div>

<div id="boom">
💥
</div>

</div>

<div id="panel">

<button class="vegBtn" onclick="selectVeg('🍅')">🍅</button>

<button class="vegBtn" onclick="selectVeg('🥔')">🥔</button>

<button class="vegBtn" onclick="selectVeg('🥬')">🥬</button>

<button class="vegBtn" onclick="selectVeg('🍄')">🍄</button>

<button class="vegBtn" onclick="selectVeg('🍠')">🍠</button>

<button onclick="resetGame()">🔄 다시하기</button>

<button onclick="toggleFullscreen()">⛶ 전체화면</button>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("handCanvas");
const ctx=canvas.getContext("2d");

const veg=document.getElementById("vegetable");
const status=document.getElementById("status");
const warning=document.getElementById("warning");
const boom=document.getElementById("boom");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let level=1;
let exploded=false;
let handDetected=false;
let currentVeg="🍅";function selectVeg(icon){

if(exploded) return;

currentVeg=icon;
veg.innerHTML=icon;

}

function playBeep(freq,duration){

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.frequency.value=freq;

osc.start();

gain.gain.setValueAtTime(0.1,audioCtx.currentTime);

gain.gain.exponentialRampToValueAtTime(
0.00001,
audioCtx.currentTime + duration
);

osc.stop(audioCtx.currentTime + duration);

}

function growVeg(){

if(exploded) return;

level++;

playBeep(700,0.1);

veg.style.fontSize=(180+(level*45))+"px";

status.innerHTML="🌱 성장 단계 : "+level;

if(level>=5){

warning.style.display="block";

warning.innerHTML="⚠️ 위험해요!";

playBeep(250,0.2);

}

if(level>=6){

warning.innerHTML="⚠️⚠️ 곧 터져요!";
playBeep(180,0.25);

}

if(level>=7){

explode();

}

}

function explode(){

exploded=true;

veg.style.display="none";

warning.style.display="none";

boom.style.display="block";

playBeep(80,0.8);

status.innerHTML="💥 앗! 너무 많이 키웠어요!";

document.body.animate(
[
{transform:'translateX(-10px)'},
{transform:'translateX(10px)'},
{transform:'translateX(-10px)'},
{transform:'translateX(10px)'},
{transform:'translateX(0px)'}
],
{
duration:500
}
);

setTimeout(()=>{

boom.style.display="none";

},1000);

}

function resetGame(){

level=1;
exploded=false;
handDetected=false;

veg.innerHTML=currentVeg;

veg.style.display="block";

veg.style.fontSize="180px";

warning.style.display="none";

boom.style.display="none";

status.innerHTML="✋ 손을 보여주세요";

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

async function startCamera(){

try{

const stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user",
width:1280,
height:720
},

audio:false

});

video.srcObject=stream;

}catch(err){

alert("카메라 권한을 허용해주세요.");

}

}

startCamera();

const hands=new Hands({

locateFile:(file)=>{

return
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});

hands.setOptions({

maxNumHands:1,
modelComplexity:1,

minDetectionConfidence:0.6,

minTrackingConfidence:0.6

});

hands.onResults((results)=>{

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

if(
results.multiHandLandmarks &&
results.multiHandLandmarks.length>0
){

handDetected=true;

status.innerHTML=
"✋ 손 감지됨! 채소 성장중";

for(
const landmarks
of results.multiHandLandmarks
){

drawConnectors(
ctx,
landmarks,
HAND_CONNECTIONS
);

drawLandmarks(
ctx,
landmarks
);

}

}else{

handDetected=false;status.innerHTML="✋ 손을 보여주세요";

}

});

const mpCamera=new Camera(
video,
{
onFrame:async()=>{

await hands.send({
image:video
});

},
width:1280,
height:720
}
);

mpCamera.start();

setInterval(()=>{

if(
handDetected &&
!exploded
){

growVeg();

}

},1000);

window.addEventListener(
'resize',
()=>{

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

}
);

</script>

</body>
</html>
