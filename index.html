<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>채소 폭탄 넘기기</title>

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Jua',sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(#87CEEB,#DFF8FF);
}

.cloud{
position:absolute;
font-size:80px;
animation:float 20s linear infinite;
}

.cloud:nth-child(1){top:50px;left:-200px;}
.cloud:nth-child(2){top:180px;left:-400px;animation-duration:30s;}
.cloud:nth-child(3){top:320px;left:-300px;animation-duration:25s;}

@keyframes float{
from{transform:translateX(0);}
to{transform:translateX(2200px);}
}

.screen{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

h1{
font-size:70px;
color:#ff6f3c;
margin-bottom:20px;
}

.subtitle{
font-size:32px;
margin-bottom:40px;
}

.btn{
width:340px;
height:100px;
border:none;
border-radius:30px;
font-size:36px;
cursor:pointer;
background:#FFD93D;
box-shadow:0 8px 0 #d8b300;
}

.btn:hover{
transform:scale(1.05);
}

.vegetables{
display:grid;
grid-template-columns:repeat(2,260px);
gap:25px;
}

.veg{
background:white;
border-radius:30px;
padding:25px;
font-size:42px;
cursor:pointer;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.2);
transition:.2s;
}

.veg:hover{
transform:scale(1.08);
}

#game{
display:none;
position:relative;
width:100vw;
height:100vh;
}

#vegetable{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:120px;
transition:.2s;
}

#warning{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
font-size:50px;
color:red;
display:none;
text-align:center;
}

#explosion{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(255,255,255,.85);
font-size:70px;
text-align:center;
}

#growBtn{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
width:420px;
height:120px;
font-size:42px;
border:none;
border-radius:30px;
background:#4CAF50;
color:white;
}

.shake{
animation:shake .3s 5;
}

@keyframes shake{
0%{transform:translate(0);}
25%{transform:translate(8px);}
50%{transform:translate(-8px);}
75%{transform:translate(8px);}
100%{transform:translate(0);}
}
</style>
</head>

<body>

<div class="cloud">☁️</div>
<div class="cloud">☁️</div>
<div class="cloud">☁️</div>

<div id="home" class="screen">

<h1>🍠 채소 폭탄 넘기기 🍄</h1>

<div class="subtitle">
채소를 크게 키워보세요!
</div>

<button class="btn" onclick="showSelect()">
게임 시작
</button>

</div>

<div id="select" class="screen" style="display:none;">

<h1>채소 선택</h1>

<div class="vegetables">

<div class="veg" onclick="startGame('🍠')">
🍠<br>고구마
</div>

<div class="veg" onclick="startGame('🍅')">
🍅<br>토마토
</div>

<div class="veg" onclick="startGame('🥔')">
🥔<br>감자
</div>

<div class="veg" onclick="startGame('🥬')">
🥬<br>배추
</div>

<div class="veg" onclick="startGame('🍄')">
🍄<br>버섯
</div>

</div>

</div>

<div id="game">

<div id="warning">
⚠ 위험해요!<br>
채소가 너무 커졌어요!
</div>

<div id="vegetable">🍠</div>

<div id="explosion">
💥 채소가 터졌어요!

<br><br>

<button class="btn" onclick="location.reload()">
다시하기
</button>

</div>

<button id="growBtn" onclick="growVegetable()">
💪 채소 키우기!
</button>

</div>

<script>

let size=120;

function showSelect(){
home.style.display="none";
select.style.display="flex";
}

function startGame(icon){

select.style.display="none";
game.style.display="block";

vegetable.innerHTML=icon;

size=120;
vegetable.style.fontSize=size+"px";

warning.style.display="none";
explosion.style.display="none";
growBtn.style.display="block";
vegetable.style.display="block";
}

function growVegetable(){

size+=25;

vegetable.style.fontSize=size+"px";

if(size>300){
warning.style.display="block";
}

if(size>550){

explosion.style.display="flex";

growBtn.style.display="none";

vegetable.style.display="none";

document.body.classList.add("shake");

}
}

</script>

</body>
</html>
