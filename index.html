<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채소 키우기 AR 게임</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Malgun Gothic',sans-serif;
}

body{
background:#000;
overflow:hidden;
}

#video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
z-index:1;
}

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:2;
pointer-events:none;
}

#vegetable{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:120px;
transition:0.3s;
text-shadow:0 0 30px rgba(0,0,0,.4);
}

#warning{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
background:red;
color:white;
padding:15px 25px;
border-radius:15px;
font-size:30px;
font-weight:bold;
display:none;
animation:blink .6s infinite;
}

@keyframes blink{
50%{
opacity:.3;
}
}

#boom{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:250px;
display:none;
animation:explode .8s ease-out;
}

@keyframes explode{
0%{
transform:translate(-50%,-50%) scale(.2);
opacity:1;
}
100%{
transform:translate(-50%,-50%) scale(2);
opacity:0;
}
}

#panel{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
z-index:3;
pointer-events:auto;
}

button{
padding:12px 18px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.vegBtn{
font-size:28px;
}

#status{
position:fixed;
top:80px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.6);
color:white;
padding:10px 20px;
border-radius:10px;
font-size:24px;
z-index:3;
}

@media (max-width:900px){

#vegetable{
font-size:90px;
}

button{
font-size:15px;
padding:10px;
}

#status{
font-size:18px;
}
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<div id="overlay">

<div id="warning">
⚠ 너무 많이 키우면 터져요!
</div>

<div id="status">
크기 : 1단계
</div>

<div id="vegetable">🍅</div>

<div id="boom">
💥
</div>

</div>

<div id="panel">

<button class="vegBtn" onclick="selectVeg('🍅')">🍅</button>
<button class="vegBtn" onclick="selectVeg('🥔')">🥔</button>
<button class="vegBtn" onclick="selectVeg('🥬')">🥬</button>
<button class="vegBtn" onclick="selectVeg('🍄')">🍄</button>
<button class="vegBtn" onclick="selectVeg('🍠')">🍠</button>

<button onclick="growVeg()">💪 키우기</button>

<button onclick="resetGame()">🔄 다시하기</button>

<button onclick="toggleFullscreen()">⛶ 전체화면</button>

</div>

<script>

const video=document.getElementById("video");
const veg=document.getElementById("vegetable");
const warning=document.getElementById("warning");
const boom=document.getElementById("boom");
const status=document.getElementById("status");

let level=1;
let exploded=false;

async function startCamera(){

try{

const stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user"
},
audio:false
});

video.srcObject=stream;

}catch(e){

alert("카메라 권한을 허용해주세요.");

}

}

startCamera();

function selectVeg(icon){

if(exploded) return;

veg.innerHTML=icon;

}

function growVeg(){

if(exploded) return;

level++;

veg.style.fontSize=(120+(level*25))+"px";

status.innerHTML="크기 : "+level+"단계";

if(level>=8){

warning.style.display="block";

}

if(level>=12){

explode();

}

}

function explode(){

exploded=true;

veg.style.display="none";

warning.style.display="none";

boom.style.display="block";

setTimeout(()=>{

boom.style.display="none";

},800);

status.innerHTML="💥 채소가 터졌어요!";

}

function resetGame(){

level=1;
exploded=false;

veg.style.display="block";
boom.style.display="none";
warning.style.display="none";

veg.style.fontSize="120px";

status.innerHTML="크기 : 1단계";

}

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}else{

document.exitFullscreen();

}

}

</script>

</body>
</html>
