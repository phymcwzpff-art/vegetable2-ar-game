<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR 채소 키우기</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:sans-serif;
}

#video{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
}

#veg{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:120px;
transition:0.15s;
}

#ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
padding:12px 24px;
background:rgba(0,0,0,.5);
color:white;
border-radius:12px;
font-size:28px;
z-index:100;
}

#boom{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:180px;
display:none;
z-index:200;
}
</style>

</head>

<body>

<video id="video" autoplay playsinline></video>

<div id="ui">
🙌 양손을 보여주세요
</div>

<div id="veg">
🍅
</div>

<div id="boom">
💥
</div>

<script>

const video = document.getElementById("video");
const veg = document.getElementById("veg");
const ui = document.getElementById("ui");
const boom = document.getElementById("boom");

let biggestDistance = 0;
let exploded = false;

function explode(){

if(exploded) return;

exploded = true;

veg.style.display = "none";
boom.style.display = "block";

ui.innerText = "💥 채소가 터졌어요!";
}

const hands = new Hands({
locateFile:(file)=>
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
maxNumHands:2,
modelComplexity:1,
minDetectionConfidence:0.7,
minTrackingConfidence:0.7
});

hands.onResults((results)=>{

if(
results.multiHandLandmarks &&
results.multiHandLandmarks.length===2
){

const h1 = results.multiHandLandmarks[0][9];
const h2 = results.multiHandLandmarks[1][9];

const dx = h1.x - h2.x;
const dy = h1.y - h2.y;

const distance =
Math.sqrt(dx*dx + dy*dy);

if(distance > biggestDistance){

biggestDistance = distance;

const size =
120 +
(biggestDistance * 1200);

veg.style.fontSize =
size + "px";

ui.innerText =
"🌱 채소 성장중!";

if(size > 600){

explode();

}

}

}else{

ui.innerText =
"🙌 양손을 보여주세요";

}

});

const camera = new Camera(video,{
onFrame:async()=>{
await hands.send({
image:video
});
},
width:1280,
height:720
});

camera.start();

</script>

</body>
</html>
