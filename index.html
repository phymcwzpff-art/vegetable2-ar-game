<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AR 채소 키우기</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:sans-serif;
}

#video{
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
}

#ui{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.5);
color:white;
padding:15px 25px;
border-radius:20px;
font-size:28px;
z-index:100;
}

#veg{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:120px;
z-index:50;
transition:0.15s;
}

#boom{
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:180px;
display:none;
z-index:200;
}

</style>

</head>

<body>

<video id="video" autoplay playsinline></video>

<div id="ui">
🙌 양손을 보여주세요
</div>

<div id="veg">
🍅
</div>

<div id="boom">
💥
</div>

<script>

const video = document.getElementById("video");
const veg = document.getElementById("veg");
const ui = document.getElementById("ui");
const boom = document.getElementById("boom");

let exploded = false;

let startDistance = null;
let maxGrowth = 0;

function explode(){

if(exploded) return;

exploded = true;

veg.style.display = "none";

boom.style.display = "block";

ui.innerText =
"💥 채소가 터졌어요!";

}

const hands = new Hands({

locateFile:(file)=>{

return
`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});

hands.setOptions({

maxNumHands:2,

modelComplexity:1,

minDetectionConfidence:0.8,

minTrackingConfidence:0.8

});

hands.onResults((results)=>{

if(exploded) return;

if(
results.multiHandLandmarks &&
results.multiHandLandmarks.length === 2
){

const hand1 =
results.multiHandLandmarks[0][9];

const hand2 =
results.multiHandLandmarks[1][9];

const dx =
hand1.x - hand2.x;

const dy =
hand1.y - hand2.y;

const distance =
Math.sqrt(dx*dx + dy*dy);

if(startDistance === null){

startDistance = distance;

ui.innerText =
"🌱 시작! 손을 더 벌려보세요";

return;

}

const growth =
Math.max(
0,
distance - startDistance
);

if(growth > maxGrowth){

maxGrowth = growth;

const size =
120 +
(maxGrowth * 2000);

veg.style.fontSize =
size + "px";

ui.innerText =
"🌱 채소 성장중!";

if(size > 900){

explode();

}

}

}else{

ui.innerText =
"🙌 양손을 보여주세요";

startDistance = null;

}

});

const camera = new Camera(video,{

onFrame:async()=>{

await hands.send({
image:video
});

},

width:1280,
height:720

});

camera.start();

</script>

</body>
</html>
